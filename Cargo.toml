[workspace]
resolver = "2"
members = [
    "src/domain",
    "src/application",
    "src/infrastructure/dbus",
    "src/infrastructure/hyprland",
    "src/infrastructure/config",
    "src/infrastructure/theme-store",
    "src/infrastructure/ipc",
    "src/infrastructure/providers",
    "src/infrastructure/plugins",
    "src/ui/host",
    "src/binaries/quantumd",
    "src/binaries/quantumctl",
    "src/binaries/quantum-dev",
    "tests/architecture-test",
    "tests/e2e",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ixiri/quantum"

[workspace.dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "process",
    "signal",
    "fs",
] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
cargo_metadata = "0.18"
futures = "0.3"
include_dir = "0.7"

# Trim dev-build debug info. The gtk/webkit `-sys` dependency tree emits a large
# amount of DWARF; full debuginfo on it dominates link time and target size
# without aiding day-to-day debugging of this workspace's own crates.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Dependencies never need debug info for debugging our own code.
[profile.dev.package."*"]
debug = false
