# Quantum keybinds for Hyprland.
# Copy these into your ~/.config/hypr/hyprland.conf or source this file.

# Launcher: toggle on Super+Space.
bind = SUPER, SPACE, exec, quantumctl view.toggle launcher

# Example: show a widget (Super+Shift+W toggles the clock widget).
bind = SUPER SHIFT, W, exec, quantumctl view.toggle widgets/clock

# Make the launcher fade in instead of slide so it feels instant.
windowrule = animation slidefade, namespace:quantum-launcher
windowrule = noborder, namespace:quantum-launcher
windowrule = float, namespace:quantum-launcher

# Widget rules: keep them on the background layer and out of focus.
windowrule = noborder, namespace:quantum-widget-widgets-clock
windowrule = noinitialfocus, namespace:quantum-widget-widgets-clock
