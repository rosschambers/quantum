<!DOCTYPE html>
<html lang="en" data-theme="$theme_tokens">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notification Center</title>
<style>
  :root { --notif-bg: #1a1a24; --notif-card: #171720; --notif-border: rgba(255,255,255,0.08); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--notif-bg); font-family: -apple-system, sans-serif; width: 100%; height: 100vh; overflow-x: hidden; }

  /* The notification widget — positioned top-right by layer-shell, but works without too */
  .widget-container { position: absolute; top: 24px; right: 24px; width: 360px; max-height: 500px; overflow: hidden; z-index: 999; }

  /* Header — only visible in expanded state */
  .widget-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--notif-border); transition: opacity, max-height 0.3s; }

  .notification-card { margin-bottom: 6px; padding: 12px 14px; background: var(--notif-card); border-left: 3px solid #6c5ce7; cursor: pointer; display: flex; align-items: flex-start; gap: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); transition: all 0.25s; }
  .notification-card.system { border-left-color: #e74c3c; }
  .notification-card.provider { border-left-color: #6c5ce7; }
  .notification-card.critical { border-left-color: #f39c12; }
  .notification-card:hover { background: rgba(255,255,255,0.06); }

  .notif-icon { width: 22px; height: 22px; border-radius: 5px; background: rgba(255,255,255,0.08); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; }
  .notif-body { flex: 1; min-width: 0; }
  .notif-app { font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.08em; color: #9393a3; }
  .notif-title { font-weight: 600; font-size: 0.8rem; margin-bottom: 2px; }
  .notif-summary { font-size: 0.72rem; color: #9393a3; line-height: 1.35; }

  /* Toast animation */
  .notification-card.toast-in { animation: slideIn 0.3s ease forwards; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
</style>
</head>
<body>
<script src="main.js"></script>
</body>
</html>
