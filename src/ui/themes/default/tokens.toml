# Quantum Default Theme Tokens

[colors]
color-bg = "#1e1e2e"
color-fg = "#cdd6f4"
color-accent = "#a6e3a1"
color-muted = "#6c7086"
color-border = "#313244"
color-bg-alt = "#313244"
color-fg-alt = "#a6adc8"
color-surface = "hsla(230, 14%, 22%, 0.8)"
color-surface-hover = "hsla(230, 14%, 42%, 1)"
color-overlay-backdrop = "rgba(0, 0, 0, 0.5)"
color-bar-bg = "rgba(30, 30, 46, 0.85)"
color-shadow = "rgba(0, 0, 0, 0.6)"
color-divider = "rgba(255, 255, 255, 0.32)"
color-warning = "#f38ba8"

[typography]
font-sans = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
font-mono = "'Fira Code', 'Courier New', monospace"
font-size-base = "14px"
font-size-sm = "12px"
font-size-lg = "16px"

[spacing]
space-1 = "0.25rem"
space-2 = "0.5rem"
space-3 = "0.75rem"
space-4 = "1rem"
space-5 = "1.5rem"
space-6 = "2rem"

[radius]
radius-sm = "2px"
radius-md = "4px"
radius-lg = "8px"

[motion]
duration-fast = "100ms"
duration-base = "200ms"
duration-slow = "300ms"
ease-default = "cubic-bezier(0.4, 0, 0.2, 1)"

[tray]
tray-icon-size = "14px"
tray-icon-color = "#cdd6f4"
tray-icon-color-active = "#a6e3a1"
tray-icon-color-warning = "#f38ba8"
tray-gap = "8px"
