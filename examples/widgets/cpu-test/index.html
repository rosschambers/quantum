<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style id="quantum-tokens">/* QUANTUM_TOKENS */</style>
    <style>
      body {
        margin: 0;
        padding: 0.5rem 1rem;
        font-family: sans-serif;
        background: var(--color-bg, #1e1e2e);
        color: var(--color-fg, #cdd6f4);
        font-size: 14px;
      }
      .cpu {
        font-weight: bold;
        color: var(--color-accent, #89b4fa);
      }
    </style>
    <script type="module">
      const w = window;

      // Wait for the WebKit bridge to expose its messageHandler.
      function ready() {
        return typeof w.webkit !== 'undefined' &&
               w.webkit.messageHandlers &&
               w.webkit.messageHandlers.quantum;
      }

      // Install our own notify handler before anything else.
      w.__quantum_notify = (channel, payload) => {
        if (channel === 'system.stats.event') {
          const cpu = Math.round(payload.cpu_percent);
          document.getElementById('cpu').textContent = cpu + '%';
        }
      };

      // Request the subscription on the dispatcher side. Daemon already
      // pre-subscribes system.stats at startup, but calling this is harmless.
      if (ready()) {
        const req = {
          jsonrpc: '2.0',
          id: 1,
          method: 'provider.subscribe',
          params: { provider: 'system.stats' },
        };
        w.webkit.messageHandlers.quantum.postMessage(JSON.stringify(req));
      }
    </script>
  </head>
  <body>
    Custom widget: CPU <span id="cpu" class="cpu">--%</span>
  </body>
</html>
