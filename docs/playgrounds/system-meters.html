<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>System Meters Design Playground</title>
<style>
:root {
    --bg: #1e1e2e;
    --bg-alt: #313244;
    --border: #45475a;
    --fg: #cdd6f4;
    --fg-alt: #a6adc8;
    --accent: #89b4fa;
    --warn: #f9e2af;
    --crit: #f38ba8;
    --good: #a6e3a1;
    --muted: #6c7086;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    font-size: 14px;
    height: 100vh;
    overflow: hidden;
}
.layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    grid-template-rows: 1fr auto;
    height: 100vh;
}
.controls {
    grid-row: 1 / 3;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
}
.preview {
    grid-row: 1;
    padding: 24px;
    overflow-y: auto;
}
.prompt-box {
    grid-row: 2;
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    background: var(--bg-alt);
    display: flex;
    gap: 12px;
    align-items: flex-start;
}
h1 { font-size: 16px; margin: 0 0 16px 0; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-alt); margin: 16px 0 8px 0; }
label { display: block; font-size: 12px; color: var(--fg-alt); margin-bottom: 4px; }
.group { margin-bottom: 16px; }
.row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.row label { flex: 1; margin: 0; }
input[type="range"] { width: 100%; }
input[type="number"] { width: 64px; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; }
select { background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 4px; width: 100%; }
button.preset { background: var(--bg-alt); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
button.preset:hover { background: var(--border); }
button.preset.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

/* Preview card. Mimics the bar surface. */
.bar-mock {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 16px;
    padding: 0 12px;
    margin-bottom: 24px;
    color: var(--fg-alt);
}
.bar-mock .filler {
    flex: 1;
    color: var(--muted);
    font-size: 12px;
}

.preview-section { margin-bottom: 32px; }
.preview-section h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--fg-alt);
    margin: 0 0 8px 0;
    font-weight: 600;
}
.variant-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
}
.variant {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
    transition: border-color 0.1s;
}
.variant:hover { border-color: var(--accent); }
.variant.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.variant .label { font-size: 11px; text-transform: uppercase; color: var(--fg-alt); letter-spacing: 0.06em; }
.variant .demo-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 6px 0;
    color: var(--fg-alt);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    padding: 6px 8px;
    border-radius: 4px;
}

/* The featured one is rendered larger at the top */
.featured {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 16px;
}
.featured h3 { color: var(--accent); margin-top: 0; }
.featured .demo-row {
    display: flex;
    align-items: center;
    gap: 24px;
    background: var(--bg-alt);
    padding: 8px 12px;
    border-radius: 4px;
    color: var(--fg-alt);
}

/* Individual meter rendering styles. The actual meter classes the
 * variants instantiate. */
.meter {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    line-height: 1;
    font-size: var(--meter-icon-size, 14px);
}
.meter .icon { opacity: 0.9; }
.meter .bucket {
    font-family: var(--font-mono);
    letter-spacing: 1px;
    font-size: var(--meter-icon-size, 14px);
}
.meter .num {
    font-variant-numeric: tabular-nums;
    font-size: var(--meter-num-size, 12px);
}
.meter svg { display: block; }

/* Pill style */
.meter.pill .pill-inner {
    background: var(--meter-pill-bg, var(--bg));
    color: var(--meter-pill-fg, var(--fg));
    padding: 2px 8px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: var(--meter-num-size, 12px);
    font-variant-numeric: tabular-nums;
}

/* Horizontal progress bar style */
.meter.hbar .hbar-wrap {
    width: var(--hbar-width, 48px);
    height: var(--hbar-height, 6px);
    background: var(--bg);
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid var(--border);
}
.meter.hbar .hbar-fill {
    height: 100%;
    background: var(--meter-fill, var(--accent));
    transition: width 0.3s ease, background 0.3s ease;
}

/* Vertical mini-bar */
.meter.vbar .vbar-wrap {
    width: 4px;
    height: 16px;
    background: var(--bg);
    border-radius: 1px;
    overflow: hidden;
    display: inline-flex;
    align-items: flex-end;
    border: 1px solid var(--border);
}
.meter.vbar .vbar-fill {
    width: 100%;
    background: var(--meter-fill, var(--accent));
    transition: height 0.3s ease, background 0.3s ease;
}

/* Donut/ring */
.meter.ring svg { vertical-align: middle; }

/* Stacked dots */
.meter.dots .dot-row {
    display: inline-flex;
    gap: 2px;
    align-items: center;
}
.meter.dots .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--muted);
}
.meter.dots .dot.filled {
    background: var(--meter-fill, var(--accent));
    border-color: var(--meter-fill, var(--accent));
}

/* Multi-segment bar */
.meter.segments .seg-row {
    display: inline-flex;
    gap: 1px;
}
.meter.segments .seg {
    width: 4px;
    height: 12px;
    background: var(--bg);
    border-radius: 1px;
}
.meter.segments .seg.filled {
    background: var(--meter-fill, var(--accent));
}

/* Sparkline tweaks */
.meter .sparkline { color: var(--meter-spark, var(--fg-alt)); }

/* Half-arc gauge */
.meter.gauge svg { vertical-align: middle; }

/* Color-only dot */
.meter.colordot .colordot-blob {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--meter-fill, var(--accent));
    box-shadow: 0 0 6px var(--meter-fill, var(--accent));
}

/* Histogram bars (alternative to polyline sparkline) */
.meter .histogram { color: var(--meter-spark, var(--fg-alt)); }

/* Prompt area */
#prompt {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--fg);
    white-space: pre-wrap;
    max-height: 180px;
    overflow-y: auto;
    line-height: 1.45;
}
#copy {
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    padding: 8px 14px;
    cursor: pointer;
    font-weight: 600;
    align-self: flex-start;
}
#copy.copied { background: var(--good); }

.threshold-chips { display: flex; gap: 4px; margin-top: 4px; }
.threshold-chips .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--fg-alt);
}
.threshold-chips .swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 2px;
}
</style>
</head>
<body>
<div class="layout">
    <aside class="controls">
        <h1>System Meters Playground</h1>

        <div class="group">
            <h2>Presets</h2>
            <div class="presets" id="presets"></div>
        </div>

        <div class="group">
            <h2>Featured style</h2>
            <select id="featured-style"></select>
        </div>

        <div class="group">
            <h2>Sizing</h2>
            <div class="row">
                <label>Icon / glyph size (px)</label>
                <input type="number" id="iconSize" min="8" max="24" />
            </div>
            <div class="row">
                <label>Numeric size (px)</label>
                <input type="number" id="numSize" min="8" max="20" />
            </div>
        </div>

        <div class="group">
            <h2>Sparkline</h2>
            <div class="row">
                <label>Width (px)</label>
                <input type="number" id="sparkW" min="16" max="120" />
            </div>
            <div class="row">
                <label>Height (px)</label>
                <input type="number" id="sparkH" min="6" max="40" />
            </div>
            <div class="row">
                <label>History samples</label>
                <input type="number" id="histLen" min="4" max="120" />
            </div>
            <div class="row">
                <label>Render</label>
                <select id="sparkType">
                    <option value="polyline">polyline (smooth)</option>
                    <option value="area">area-filled</option>
                    <option value="histogram">histogram bars</option>
                </select>
            </div>
        </div>

        <div class="group">
            <h2>Color coding</h2>
            <div class="row">
                <label>Mode</label>
                <select id="colorMode">
                    <option value="static">single color</option>
                    <option value="threshold">threshold (good/warn/crit)</option>
                    <option value="gradient">gradient (cold-to-hot)</option>
                </select>
            </div>
            <div class="row">
                <label>Warn threshold %</label>
                <input type="number" id="warnAt" min="0" max="100" />
            </div>
            <div class="row">
                <label>Crit threshold %</label>
                <input type="number" id="critAt" min="0" max="100" />
            </div>
            <div class="threshold-chips">
                <span class="chip"><span class="swatch" style="background: var(--good)"></span>good</span>
                <span class="chip"><span class="swatch" style="background: var(--warn)"></span>warn</span>
                <span class="chip"><span class="swatch" style="background: var(--crit)"></span>crit</span>
            </div>
        </div>

        <div class="group">
            <h2>Number display</h2>
            <div class="row">
                <label>Show numeric?</label>
                <select id="showNum">
                    <option value="always">always</option>
                    <option value="warn">only when warn+</option>
                    <option value="never">never (tooltip only)</option>
                </select>
            </div>
            <div class="row">
                <label>Numeric format</label>
                <select id="numFmt">
                    <option value="pct">42%</option>
                    <option value="pct-pad">042%</option>
                    <option value="frac">42/100</option>
                    <option value="dec">0.42</option>
                </select>
            </div>
        </div>

        <div class="group">
            <h2>Show / hide</h2>
            <div class="row">
                <label>Show icon glyph?</label>
                <select id="showIcon">
                    <option value="yes">yes</option>
                    <option value="no">no</option>
                </select>
            </div>
            <div class="row">
                <label>Show bucket bar?</label>
                <select id="showBucket">
                    <option value="yes">yes</option>
                    <option value="no">no</option>
                </select>
            </div>
            <div class="row">
                <label>Show sparkline?</label>
                <select id="showSpark">
                    <option value="yes">yes</option>
                    <option value="no">no</option>
                </select>
            </div>
        </div>

        <div class="group">
            <h2>Simulated load</h2>
            <div class="row">
                <label>CPU %</label>
                <input type="range" id="simCpu" min="0" max="100" />
            </div>
            <div class="row">
                <label>MEM %</label>
                <input type="range" id="simMem" min="0" max="100" />
            </div>
            <div class="row">
                <label>Animate (random walk)</label>
                <input type="checkbox" id="simAnimate" />
            </div>
        </div>
    </aside>

    <section class="preview">
        <div class="bar-mock" id="bar-mock">
            <span class="filler">(active window title)</span>
            <span id="featured-cpu"></span>
            <span id="featured-mem"></span>
        </div>

        <div class="featured">
            <h3>Featured (mirrors your control choices)</h3>
            <div class="demo-row">
                <span id="featured-cpu-big"></span>
                <span id="featured-mem-big"></span>
            </div>
        </div>

        <div class="preview-section">
            <h3>All variants — current vs alternatives</h3>
            <div class="variant-grid" id="variant-grid"></div>
        </div>
    </section>

    <div class="prompt-box">
        <pre id="prompt"></pre>
        <button id="copy">Copy prompt</button>
    </div>
</div>

<script>
// All variant renderers. Each takes (label, percent, history, options) and
// returns an HTMLElement representing the meter. `options` carries the
// global state so each variant can respect sizing, color mode, etc.
const VARIANTS = {
    'bucket-spark': {
        label: 'Icon + bucket + sparkline (current)',
        render(label, pct, hist, o) {
            const wrap = makeMeter(o);
            if (o.showIcon === 'yes') wrap.appendChild(makeIcon(label));
            if (o.showBucket === 'yes') wrap.appendChild(makeBucket(pct, o));
            const num = makeNumber(pct, o, label);
            if (num) wrap.appendChild(num);
            if (o.showSpark === 'yes') wrap.appendChild(makeSpark(hist, pct, o));
            return wrap;
        },
    },
    'numeric': {
        label: 'Numeric only (current behavior)',
        render(label, pct, hist, o) {
            const wrap = makeMeter(o);
            if (o.showIcon === 'yes') wrap.appendChild(makeIcon(label));
            const t = document.createElement('span');
            t.className = 'num';
            t.style.color = colorFor(pct, o);
            t.textContent = `${label} ${formatNumber(pct, o)}`;
            wrap.appendChild(t);
            return wrap;
        },
    },
    'pill': {
        label: 'Pill / colored badge',
        render(label, pct, hist, o) {
            const wrap = makeMeter(o);
            wrap.classList.add('pill');
            const pill = document.createElement('span');
            pill.className = 'pill-inner';
            pill.style.setProperty('--meter-pill-bg', colorFor(pct, o, 0.25));
            pill.style.setProperty('--meter-pill-fg', colorFor(pct, o));
            if (o.showIcon === 'yes') {
                const i = document.createElement('span');
                i.textContent = iconFor(label);
                pill.appendChild(i);
            }
            const num = document.createElement('span');
            num.textContent = formatNumber(pct, o);
            pill.appendChild(num);
            wrap.appendChild(pill);
            return wrap;
        },
    },
    'hbar': {
        label: 'Horizontal progress bar',
        render(label, pct, hist, o) {
            const wrap = makeMeter(o);
            wrap.classList.add('hbar');
            if (o.showIcon === 'yes') wrap.appendChild(makeIcon(label));
            const w = document.createElement('span');
            w.className = 'hbar-wrap';
            const f = document.createElement('span');
            f.className = 'hbar-fill';
            f.style.width = `${pct}%`;
            f.style.background = colorFor(pct, o);
            w.appendChild(f);
            wrap.appendChild(w);
            const num = makeNumber(pct, o, label);
            if (num) wrap.appendChild(num);
            return wrap;
        },
    },
    'vbar': {
        label: 'Vertical mini-bar',
        render(label, pct, hist, o) {
            const wrap = makeMeter(o);
            wrap.classList.add('vbar');
            if (o.showIcon === 'yes') wrap.appendChild(makeIcon(label));
            const w = document.createElement('span');
            w.className = 'vbar-wrap';
            const f = document.createElement('span');
            f.className = 'vbar-fill';
            f.style.height = `${pct}%`;
            f.style.background = colorFor(pct, o);
            w.appendChild(f);
            wrap.appendChild(w);
            const num = makeNumber(pct, o, label);
            if (num) wrap.appendChild(num);
            return wrap;
        },
    },
    'ring': {
        label: 'Donut / ring',
        render(label, pct, hist, o) {
            const wrap = makeMeter(o);
            wrap.classList.add('ring');
            if (o.showIcon === 'yes') wrap.appendChild(makeIcon(label));
            const size = o.iconSize + 4;
            const r = (size - 4) / 2;
            const c = 2 * Math.PI * r;
            const offset = c * (1 - pct / 100);
            const svg = svgEl('svg', { width: size, height: size, viewBox: `0 0 ${size} ${size}` });
            svg.appendChild(svgEl('circle', {
                cx: size / 2, cy: size / 2, r,
                fill: 'none', stroke: 'rgba(255,255,255,0.1)', 'stroke-width': '2',
            }));
            const fg = svgEl('circle', {
                cx: size / 2, cy: size / 2, r,
                fill: 'none', stroke: colorFor(pct, o), 'stroke-width': '2',
                'stroke-dasharray': `${c} ${c}`,
                'stroke-dashoffset': offset,
                transform: `rotate(-90 ${size / 2} ${size / 2})`,
                'stroke-linecap': 'round',
            });
            svg.appendChild(fg);
            wrap.appendChild(svg);
            const num = makeNumber(pct, o, label);
            if (num) wrap.appendChild(num);
            return wrap;
        },
    },
    'gauge': {
        label: 'Half-arc gauge',
        render(label, pct, hist, o) {
            const wrap = makeMeter(o);
            wrap.classList.add('gauge');
            if (o.showIcon === 'yes') wrap.appendChild(makeIcon(label));
            const w = o.iconSize * 2;
            const h = o.iconSize + 2;
            const r = w / 2 - 2;
            const cx = w / 2;
            const cy = h - 2;
            const svg = svgEl('svg', { width: w, height: h, viewBox: `0 0 ${w} ${h}` });
            // background arc
            svg.appendChild(svgEl('path', {
                d: `M${cx - r},${cy} A${r},${r} 0 0 1 ${cx + r},${cy}`,
                fill: 'none', stroke: 'rgba(255,255,255,0.1)', 'stroke-width': '2',
            }));
            // value arc (pct of the half-circle)
            const angle = Math.PI * (pct / 100);
            const x = cx - r * Math.cos(angle);
            const y = cy - r * Math.sin(angle);
            const largeArc = 0;
            const sweep = 1;
            svg.appendChild(svgEl('path', {
                d: `M${cx - r},${cy} A${r},${r} 0 ${largeArc} ${sweep} ${x},${y}`,
                fill: 'none', stroke: colorFor(pct, o), 'stroke-width': '2',
                'stroke-linecap': 'round',
            }));
            wrap.appendChild(svg);
            const num = makeNumber(pct, o, label);
            if (num) wrap.appendChild(num);
            return wrap;
        },
    },
    'dots': {
        label: 'Filled dots (1-10)',
        render(label, pct, hist, o) {
            const wrap = makeMeter(o);
            wrap.classList.add('dots');
            if (o.showIcon === 'yes') wrap.appendChild(makeIcon(label));
            const row = document.createElement('span');
            row.className = 'dot-row';
            const filled = Math.round(pct / 10);
            for (let i = 0; i < 10; i += 1) {
                const d = document.createElement('span');
                d.className = 'dot' + (i < filled ? ' filled' : '');
                if (i < filled) d.style.setProperty('--meter-fill', colorFor(pct, o));
                row.appendChild(d);
            }
            wrap.appendChild(row);
            const num = makeNumber(pct, o, label);
            if (num) wrap.appendChild(num);
            return wrap;
        },
    },
    'segments': {
        label: 'Segmented bar (10 cells)',
        render(label, pct, hist, o) {
            const wrap = makeMeter(o);
            wrap.classList.add('segments');
            if (o.showIcon === 'yes') wrap.appendChild(makeIcon(label));
            const row = document.createElement('span');
            row.className = 'seg-row';
            const filled = Math.round(pct / 10);
            for (let i = 0; i < 10; i += 1) {
                const s = document.createElement('span');
                s.className = 'seg' + (i < filled ? ' filled' : '');
                if (i < filled) s.style.setProperty('--meter-fill', colorFor(pct, o));
                row.appendChild(s);
            }
            wrap.appendChild(row);
            const num = makeNumber(pct, o, label);
            if (num) wrap.appendChild(num);
            return wrap;
        },
    },
    'colordot': {
        label: 'Color-coded dot only',
        render(label, pct, hist, o) {
            const wrap = makeMeter(o);
            wrap.classList.add('colordot');
            if (o.showIcon === 'yes') wrap.appendChild(makeIcon(label));
            const d = document.createElement('span');
            d.className = 'colordot-blob';
            d.style.setProperty('--meter-fill', colorFor(pct, o));
            wrap.appendChild(d);
            const num = makeNumber(pct, o, label);
            if (num) wrap.appendChild(num);
            return wrap;
        },
    },
    'spark-only': {
        label: 'Sparkline only (icon optional)',
        render(label, pct, hist, o) {
            const wrap = makeMeter(o);
            if (o.showIcon === 'yes') wrap.appendChild(makeIcon(label));
            wrap.appendChild(makeSpark(hist, pct, o));
            const num = makeNumber(pct, o, label);
            if (num) wrap.appendChild(num);
            return wrap;
        },
    },
    'ring-spark': {
        label: 'Ring + sparkline',
        render(label, pct, hist, o) {
            const ringMeter = VARIANTS['ring'].render(label, pct, hist, o);
            ringMeter.appendChild(makeSpark(hist, pct, o));
            return ringMeter;
        },
    },
    'hbar-spark': {
        label: 'Horizontal bar + sparkline',
        render(label, pct, hist, o) {
            const m = VARIANTS['hbar'].render(label, pct, hist, o);
            m.appendChild(makeSpark(hist, pct, o));
            return m;
        },
    },
};

const PRESETS = {
    'Current': {
        featuredStyle: 'bucket-spark',
        iconSize: 14, numSize: 12,
        sparkW: 36, sparkH: 14, histLen: 32, sparkType: 'polyline',
        colorMode: 'static', warnAt: 70, critAt: 90,
        showNum: 'never', numFmt: 'pct',
        showIcon: 'yes', showBucket: 'yes', showSpark: 'yes',
    },
    'Minimalist': {
        featuredStyle: 'colordot',
        iconSize: 14, numSize: 12,
        sparkW: 36, sparkH: 14, histLen: 32, sparkType: 'polyline',
        colorMode: 'threshold', warnAt: 60, critAt: 85,
        showNum: 'warn', numFmt: 'pct',
        showIcon: 'no', showBucket: 'no', showSpark: 'no',
    },
    'Data-dense': {
        featuredStyle: 'hbar-spark',
        iconSize: 14, numSize: 11,
        sparkW: 48, sparkH: 14, histLen: 64, sparkType: 'polyline',
        colorMode: 'threshold', warnAt: 70, critAt: 90,
        showNum: 'always', numFmt: 'pct',
        showIcon: 'yes', showBucket: 'no', showSpark: 'yes',
    },
    'Donut': {
        featuredStyle: 'ring',
        iconSize: 14, numSize: 11,
        sparkW: 36, sparkH: 14, histLen: 32, sparkType: 'polyline',
        colorMode: 'threshold', warnAt: 70, critAt: 90,
        showNum: 'warn', numFmt: 'pct',
        showIcon: 'no', showBucket: 'no', showSpark: 'no',
    },
    'Pill badges': {
        featuredStyle: 'pill',
        iconSize: 14, numSize: 11,
        sparkW: 36, sparkH: 14, histLen: 32, sparkType: 'polyline',
        colorMode: 'threshold', warnAt: 70, critAt: 90,
        showNum: 'always', numFmt: 'pct',
        showIcon: 'yes', showBucket: 'no', showSpark: 'no',
    },
    'Histogram': {
        featuredStyle: 'spark-only',
        iconSize: 14, numSize: 11,
        sparkW: 48, sparkH: 16, histLen: 24, sparkType: 'histogram',
        colorMode: 'threshold', warnAt: 70, critAt: 90,
        showNum: 'warn', numFmt: 'pct',
        showIcon: 'yes', showBucket: 'no', showSpark: 'yes',
    },
};

const ICONS = {
    CPU: '\u2699',  // gear
    MEM: '\u25a3',  // framed square
};

const state = {};
Object.assign(state, PRESETS['Current']);

let cpuHistory = [];
let memHistory = [];

function svgEl(tag, attrs) {
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
}

function iconFor(label) {
    return ICONS[label] ?? '?';
}

function makeMeter(o) {
    const el = document.createElement('span');
    el.className = 'meter';
    el.style.setProperty('--meter-icon-size', `${o.iconSize}px`);
    el.style.setProperty('--meter-num-size', `${o.numSize}px`);
    return el;
}

function makeIcon(label) {
    const i = document.createElement('span');
    i.className = 'icon';
    i.textContent = iconFor(label);
    return i;
}

function makeBucket(pct, o) {
    const b = document.createElement('span');
    b.className = 'bucket';
    let g = '\u25af\u25af\u25af';
    if (pct >= 67) g = '\u25ae\u25ae\u25ae';
    else if (pct >= 33) g = '\u25ae\u25ae\u25af';
    else if (pct > 0) g = '\u25ae\u25af\u25af';
    b.textContent = g;
    b.style.color = colorFor(pct, o);
    return b;
}

function makeNumber(pct, o, label) {
    if (o.showNum === 'never') return null;
    if (o.showNum === 'warn' && pct < o.warnAt) return null;
    const n = document.createElement('span');
    n.className = 'num';
    n.textContent = formatNumber(pct, o);
    n.style.color = colorFor(pct, o);
    return n;
}

function formatNumber(pct, o) {
    const r = Math.round(pct);
    if (o.numFmt === 'pct-pad') return `${String(r).padStart(3, '0')}%`;
    if (o.numFmt === 'frac') return `${r}/100`;
    if (o.numFmt === 'dec') return (pct / 100).toFixed(2);
    return `${r}%`;
}

function colorFor(pct, o, alpha) {
    let base;
    if (o.colorMode === 'static') {
        base = getCss('--fg-alt');
    } else if (o.colorMode === 'threshold') {
        if (pct >= o.critAt) base = getCss('--crit');
        else if (pct >= o.warnAt) base = getCss('--warn');
        else base = getCss('--good');
    } else if (o.colorMode === 'gradient') {
        // Lerp blue -> red across 0-100.
        const r = Math.round(80 + (pct / 100) * 175);
        const g = Math.round(180 - (pct / 100) * 130);
        const b = Math.round(250 - (pct / 100) * 200);
        base = `rgb(${r},${g},${b})`;
    }
    if (alpha !== undefined) {
        return withAlpha(base, alpha);
    }
    return base;
}

function withAlpha(color, a) {
    // Cheap and dirty: convert #rrggbb to rgba(). Doesn't handle rgb()
    // inputs; for those, slap an alpha layer via box-shadow upstream.
    if (color.startsWith('#') && color.length === 7) {
        const r = parseInt(color.slice(1, 3), 16);
        const g = parseInt(color.slice(3, 5), 16);
        const b = parseInt(color.slice(5, 7), 16);
        return `rgba(${r},${g},${b},${a})`;
    }
    if (color.startsWith('rgb(')) {
        return color.replace('rgb(', 'rgba(').replace(')', `,${a})`);
    }
    return color;
}

function getCss(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function makeSpark(hist, pct, o) {
    const w = o.sparkW;
    const h = o.sparkH;
    const svg = svgEl('svg', {
        class: 'sparkline',
        width: w, height: h,
        viewBox: `0 0 ${w} ${h}`,
        preserveAspectRatio: 'none',
    });
    if (hist.length < 2) return svg;
    if (o.sparkType === 'histogram') {
        const n = hist.length;
        const barW = w / n;
        for (let i = 0; i < n; i += 1) {
            const v = hist[i];
            const bh = (v / 100) * (h - 1);
            const x = i * barW;
            const y = h - bh;
            svg.appendChild(svgEl('rect', {
                x, y, width: Math.max(1, barW - 0.5), height: bh,
                fill: colorFor(v, o),
            }));
        }
        return svg;
    }
    const n = hist.length;
    const stepX = n > 1 ? w / (n - 1) : 0;
    const points = [];
    for (let i = 0; i < n; i += 1) {
        const x = stepX * i;
        const y = h - 1 - (hist[i] / 100) * (h - 2);
        points.push(`${x.toFixed(2)},${y.toFixed(2)}`);
    }
    if (o.sparkType === 'area') {
        // Add baseline corners to close the polygon
        const polyPoints = `0,${h} ${points.join(' ')} ${w},${h}`;
        svg.appendChild(svgEl('polygon', {
            points: polyPoints,
            fill: withAlpha(colorFor(pct, o), 0.3),
            stroke: colorFor(pct, o),
            'stroke-width': '1',
            'stroke-linejoin': 'round',
        }));
    } else {
        svg.appendChild(svgEl('polyline', {
            points: points.join(' '),
            fill: 'none',
            stroke: colorFor(pct, o),
            'stroke-width': '1',
            'stroke-linecap': 'round',
            'stroke-linejoin': 'round',
        }));
    }
    return svg;
}

function renderAll() {
    const cpu = state.simCpu;
    const mem = state.simMem;
    cpuHistory.push(cpu);
    memHistory.push(mem);
    if (cpuHistory.length > state.histLen) cpuHistory = cpuHistory.slice(-state.histLen);
    if (memHistory.length > state.histLen) memHistory = memHistory.slice(-state.histLen);

    // Mini bar mock
    const miniCpu = document.getElementById('featured-cpu');
    const miniMem = document.getElementById('featured-mem');
    miniCpu.replaceChildren(VARIANTS[state.featuredStyle].render('CPU', cpu, cpuHistory, state));
    miniMem.replaceChildren(VARIANTS[state.featuredStyle].render('MEM', mem, memHistory, state));

    // Featured big card
    const bigCpu = document.getElementById('featured-cpu-big');
    const bigMem = document.getElementById('featured-mem-big');
    const bigState = { ...state, iconSize: state.iconSize * 1.5, numSize: state.numSize * 1.4, sparkW: state.sparkW * 1.5, sparkH: state.sparkH * 1.5 };
    bigCpu.replaceChildren(VARIANTS[state.featuredStyle].render('CPU', cpu, cpuHistory, bigState));
    bigMem.replaceChildren(VARIANTS[state.featuredStyle].render('MEM', mem, memHistory, bigState));

    // Variant grid
    const grid = document.getElementById('variant-grid');
    grid.innerHTML = '';
    for (const [key, v] of Object.entries(VARIANTS)) {
        const card = document.createElement('div');
        card.className = 'variant' + (key === state.featuredStyle ? ' selected' : '');
        card.addEventListener('click', () => {
            state.featuredStyle = key;
            document.getElementById('featured-style').value = key;
            renderAll();
            updatePrompt();
        });
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = v.label;
        const row = document.createElement('div');
        row.className = 'demo-row';
        row.appendChild(v.render('CPU', cpu, cpuHistory, state));
        row.appendChild(v.render('MEM', mem, memHistory, state));
        card.appendChild(label);
        card.appendChild(row);
        grid.appendChild(card);
    }
}

function updatePrompt() {
    const variantLabel = VARIANTS[state.featuredStyle].label;

    const parts = [];
    parts.push(`Update \`frontend/themes/default/views/widgets/bar/src/lib/SystemMeters.svelte\` to render the CPU and MEM meters as: ${variantLabel}.`);

    const sub = [];
    sub.push(`Glyph/icon size ${state.iconSize}px`);
    if (state.showNum !== 'never') sub.push(`numeric size ${state.numSize}px`);
    if (state.showIcon === 'yes') sub.push('show the unicode icon (\u2699 for CPU, \u25a3 for MEM)');
    else sub.push('hide the icon glyph');
    if (state.showBucket === 'yes') sub.push('show the 3-cell bucket bar');
    if (state.showSpark === 'yes') {
        sub.push(`include a ${state.sparkW}\u00d7${state.sparkH} sparkline rendered as ${state.sparkType}, retaining the last ${state.histLen} samples (~${state.histLen} seconds at 1Hz)`);
    } else {
        sub.push('omit the sparkline');
    }

    if (state.showNum === 'always') sub.push(`always display the numeric value in format \`${formatNumber(42, state)}\``);
    else if (state.showNum === 'warn') sub.push(`display the numeric value only when the percent is at or above the warn threshold (${state.warnAt}%)`);
    else sub.push('keep the numeric value tooltip-only (no on-screen text)');

    if (state.colorMode === 'static') sub.push('use a single static color (`--color-fg-alt`)');
    else if (state.colorMode === 'threshold') sub.push(`color-code by threshold: <${state.warnAt}% good (green), \u2265${state.warnAt}% warn (yellow), \u2265${state.critAt}% crit (red)`);
    else sub.push('color-code on a smooth gradient from cool blue (0%) to hot red (100%)');

    parts.push(sub.join('. ') + '.');
    parts.push('Keep the percent in the `title` tooltip regardless of the visible numeric display. Match the size of the tray indicators on the right (var(--tray-icon-size, 14px)). Pre-existing acceptance criteria: subscribe + provider.query catch-up on mount, $effect-based lifecycle, no regressions in Vitest. Update SystemMeters.test.ts assertions to reflect the new DOM shape (selectors and class names).');

    document.getElementById('prompt').textContent = parts.join('\n\n');
}

function buildControls() {
    // Style dropdown
    const sel = document.getElementById('featured-style');
    for (const [key, v] of Object.entries(VARIANTS)) {
        const o = document.createElement('option');
        o.value = key; o.textContent = v.label;
        sel.appendChild(o);
    }
    sel.value = state.featuredStyle;
    sel.addEventListener('change', () => { state.featuredStyle = sel.value; renderAll(); updatePrompt(); });

    const bind = (id, key, parser = (v) => v) => {
        const el = document.getElementById(id);
        el.value = state[key];
        el.addEventListener('input', () => { state[key] = parser(el.value); renderAll(); updatePrompt(); });
        el.addEventListener('change', () => { state[key] = parser(el.value); renderAll(); updatePrompt(); });
    };
    const bindCheckbox = (id, key) => {
        const el = document.getElementById(id);
        el.checked = state[key] === true;
        el.addEventListener('change', () => { state[key] = el.checked; renderAll(); updatePrompt(); });
    };

    bind('iconSize', 'iconSize', Number);
    bind('numSize', 'numSize', Number);
    bind('sparkW', 'sparkW', Number);
    bind('sparkH', 'sparkH', Number);
    bind('histLen', 'histLen', Number);
    bind('sparkType', 'sparkType');
    bind('colorMode', 'colorMode');
    bind('warnAt', 'warnAt', Number);
    bind('critAt', 'critAt', Number);
    bind('showNum', 'showNum');
    bind('numFmt', 'numFmt');
    bind('showIcon', 'showIcon');
    bind('showBucket', 'showBucket');
    bind('showSpark', 'showSpark');
    bind('simCpu', 'simCpu', Number);
    bind('simMem', 'simMem', Number);
    bindCheckbox('simAnimate', 'simAnimate');

    // Presets
    const presetsEl = document.getElementById('presets');
    for (const [name, preset] of Object.entries(PRESETS)) {
        const b = document.createElement('button');
        b.className = 'preset';
        b.textContent = name;
        b.addEventListener('click', () => {
            Object.assign(state, preset);
            // Sync form values
            for (const [k, v] of Object.entries(preset)) {
                const el = document.getElementById(k);
                if (el) el.value = v;
            }
            // Mark active
            document.querySelectorAll('.preset').forEach(p => p.classList.remove('active'));
            b.classList.add('active');
            renderAll();
            updatePrompt();
        });
        presetsEl.appendChild(b);
    }
}

function defaultSimValues() {
    state.simCpu ??= 47;
    state.simMem ??= 62;
    state.simAnimate ??= true;
    document.getElementById('simCpu').value = state.simCpu;
    document.getElementById('simMem').value = state.simMem;
    document.getElementById('simAnimate').checked = state.simAnimate;
}

// Random walk animation. Pushes a new sample roughly every second.
let lastTick = 0;
function tick(ts) {
    if (state.simAnimate) {
        if (!lastTick) lastTick = ts;
        if (ts - lastTick > 700) {
            lastTick = ts;
            const stepCpu = (Math.random() - 0.5) * 14;
            const stepMem = (Math.random() - 0.5) * 4;
            state.simCpu = Math.max(0, Math.min(100, state.simCpu + stepCpu));
            state.simMem = Math.max(0, Math.min(100, state.simMem + stepMem));
            document.getElementById('simCpu').value = Math.round(state.simCpu);
            document.getElementById('simMem').value = Math.round(state.simMem);
            renderAll();
        }
    }
    requestAnimationFrame(tick);
}

document.getElementById('copy').addEventListener('click', async () => {
    const text = document.getElementById('prompt').textContent;
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById('copy');
    btn.classList.add('copied');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = 'Copy prompt'; }, 1200);
});

defaultSimValues();
buildControls();
// Seed history with the initial value so things render right away.
cpuHistory = Array.from({ length: 8 }, () => state.simCpu);
memHistory = Array.from({ length: 8 }, () => state.simMem);
renderAll();
updatePrompt();
requestAnimationFrame(tick);

// Mark default preset as active
document.querySelector('.preset')?.classList.add('active');
</script>
</body>
