name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      # The GTK4, WebKitGTK 6, and gtk4-layer-shell toolchain is not available
      # through apt on Ubuntu, so CI uses the same Nix environment as local
      # development (shell.nix, driven locally by scripts/devsh.sh). The
      # nix_path pins <nixpkgs> so `import <nixpkgs>` in shell.nix resolves.
      #
      # nixos-unstable is required because the workspace depends on crates that
      # need a recent Rust (edition 2024 in a transitive dependency, and the
      # rust-toolchain.toml pins 1.85). The stable channels lag well behind:
      # nixos-24.11 ships rustc 1.82, which cannot even parse the manifests.
      # This matches the unstable channel used locally (rustc 1.95).
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Cache the /nix/store closure (GTK4, WebKitGTK, the Rust toolchain, ...)
      # so it is not re-downloaded from cache.nixos.org on every run. Each run
      # saves a fresh cache keyed by run id and restores the most recent one
      # for this shell.nix; stale caches are garbage collected.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('shell.nix') }}-${{ github.run_id }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ hashFiles('shell.nix') }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: 604800
          purge-primary-key: never

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: src/ui/pnpm-lock.yaml

      # Cache compiled cargo dependencies (the gtk-rs / webkit bindings and the
      # rest of the workspace) keyed off Cargo.lock.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        working-directory: src/ui
        run: pnpm install --frozen-lockfile

      # The frontend must build before the Rust build: quantumd's build.rs
      # embeds each view's compiled dist/.
      - name: Build frontend
        working-directory: src/ui
        run: pnpm -r build

      # Rust format, lint, and tests run inside the nix-shell so the GTK4 and
      # WebKitGTK -sys crates find their libraries via pkg-config, exactly as
      # scripts/devsh.sh does locally.
      - name: Rust format, lint, and test
        run: |
          nix-shell --run '
            set -euo pipefail
            cargo fmt --all -- --check
            cargo clippy --workspace --all-targets -- -D warnings
            # Build the binaries first: the e2e test (quantum-e2e) spawns the
            # compiled target/debug/quantumd, so it must exist before the test
            # run rather than relying on a leftover artifact.
            cargo build --workspace
            cargo test --workspace
          ' shell.nix

      - name: Run frontend tests
        working-directory: src/ui
        run: pnpm -r test
