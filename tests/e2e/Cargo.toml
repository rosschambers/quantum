[package]
name = "quantum-e2e"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
quantum-domain = { path = "../../src/domain" }
serde_json.workspace = true
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tokio = { workspace = true, features = ["process", "net", "signal", "rt", "io-util"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
libc = "0.2"
